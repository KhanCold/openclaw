name: Doctor duplicate lookup baseline proof

on:
  push:
    branches: [proof/177352-baseline-red]

permissions: {}

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Verify baseline source before dependency setup
        run: |
          git cat-file -e 11c31139b9e0ccfdb6dd81b5b8cdc4db2a2e3627
          test -z "$(git diff 11c31139b9e0ccfdb6dd81b5b8cdc4db2a2e3627 HEAD -- src/commands/doctor-session-sqlite-retirement.ts)"
      - name: Install frozen dependencies without lifecycle scripts
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify baseline source and observe the intended failing work budget
        shell: bash
        run: |
          set +e
          corepack pnpm test src/commands/doctor-session-sqlite.discovery.test.ts --maxWorkers=1 -t 'settles many duplicate archives without rescanning the inventory for each claim' 2>&1 | tee "$RUNNER_TEMP/baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import os,pathlib,re
          log=pathlib.Path(os.environ['RUNNER_TEMP'],'baseline.log').read_text()
          log=re.sub(r'\x1b\[[0-9;]*m','',log)
          assert 'to be less than or equal to 2048' in log, log
          assert re.search(r'Tests\s+1 failed',log), log
          print('EXPECTED BASELINE RED: actual Doctor settled and imported 64 duplicate groups; artifact path-read budget failed.')
          PY

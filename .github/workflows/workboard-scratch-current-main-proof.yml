name: Workboard scratch prompt conflict repair proof

on:
  workflow_dispatch:
  push:
    branches: [proof/workboard-scratch-merge-2026-11-02]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    env:
      BASE_SHA: b15c658270ddab1a3942a6560f6520301f6aed6c
      CANDIDATE_TREE: 013172324369cdf50c6cf97d5072ea36433265f5
      PATCH_SHA256: 0d71f978133350af04c89c0f3d306c04315c8f9dd2e1c6e1114d973c19ef3333
      PROOF_MODE: ${{ matrix.mode }}
    steps:
      - name: Checkout proof inputs without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Checkout the pinned public baseline without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ env.BASE_SHA }}
          path: subject
          persist-credentials: false
      - name: Set up pinned Node without a package-manager cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Materialize and verify the exact source tree
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          patch="$RUNNER_TEMP/176215-resolution.patch"
          base64 --decode "$GITHUB_WORKSPACE/proof/proof/176215-resolution.patch.b64" > "$patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum -c -
          if [ "$PROOF_MODE" = candidate ]; then
            git apply --index "$patch"
            test "$(git write-tree)" = "$CANDIDATE_TREE"
          else
            git apply --index --include=extensions/workboard/src/dispatcher-scratch-context.test.ts "$patch"
          fi
          printf 'Base HEAD: %s\nIndex tree: %s\nMode: %s\n' "$BASE_SHA" "$(git write-tree)" "$PROOF_MODE" >> "$GITHUB_STEP_SUMMARY"
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the identical dispatcher regression on baseline
        if: matrix.mode == 'baseline'
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          set +e
          corepack pnpm test extensions/workboard/src/dispatcher-scratch-context.test.ts --maxWorkers=1 --reporter=verbose > "$RUNNER_TEMP/176215-baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/176215-baseline.log"
          test "$result" -ne 0
          python3 - "$RUNNER_TEMP/176215-baseline.log" <<'PY'
          import pathlib,re,sys
          text=re.sub(r'\x1b\[[0-9;]*m','',pathlib.Path(sys.argv[1]).read_text())
          assert 'keeps a retained path out of the actual scratch worker prompt' in text
          assert re.search(r'Tests\s+1 failed(?:\s|$)',text)
          assert '/workspace/repository' in text
          PY
      - name: Run candidate owner tests, prefix control, and static checks
        if: matrix.mode == 'candidate'
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          for file in extensions/workboard/src/dispatcher-scratch-context.test.ts extensions/workboard/src/store.test.ts src/agents/agent-tools.prefix-stability.test.ts; do
            started_ms="$(date +%s%3N)"
            corepack pnpm test "$file" --maxWorkers=1
            elapsed_ms=$(( $(date +%s%3N) - started_ms ))
            printf 'Test wall time: %s ms; file: %s\n' "$elapsed_ms" "$file" >> "$GITHUB_STEP_SUMMARY"
          done
          corepack pnpm format:check extensions/workboard/src/dispatcher-scratch-context.test.ts extensions/workboard/src/store-card-helpers.ts extensions/workboard/src/store.test.ts
          corepack pnpm lint --files-json '["extensions/workboard/src/dispatcher-scratch-context.test.ts","extensions/workboard/src/store-card-helpers.ts","extensions/workboard/src/store.test.ts"]'
          corepack pnpm tsgo:extensions
          corepack pnpm tsgo:extensions:test
          corepack pnpm check:test-lines-ratchet --base "$BASE_SHA" --no-merge-base
          git diff --cached --check "$BASE_SHA"
          git diff --exit-code
          test "$(git write-tree)" = "$CANDIDATE_TREE"

name: config-builder-empty-args-proof

on:
  push:
    branches:
      - proof/config-builder-empty-args-2026-10-29

permissions:
  contents: read

jobs:
  config-builder:
    name: Base red, candidate green, and scoped checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE_SHA: 1347e901fce121a46962b706baa0f61f09f87860
      CANDIDATE_SHA: 9f1496bfd6ac846d0565fc259123d8af6284beb5
      CANDIDATE_REF: task/2026-11-02-config-builder-empty-args-current-main
      REPO_DIR: ${{ github.workspace }}/.proof-checkout
      PROOF_DIR: ${{ github.workspace }}/.proof-evidence
    steps:
      - name: Checkout evidence branch without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: false

      - name: Fetch exact public base and candidate snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR" "$REPO_DIR"
          git -C "$REPO_DIR" init --quiet
          git -C "$REPO_DIR" remote add fork https://github.com/KhanCold/openclaw.git
          git -C "$REPO_DIR" fetch --no-tags --depth=1 fork "refs/heads/$CANDIDATE_REF"
          fetched_candidate="$(git -C "$REPO_DIR" rev-parse FETCH_HEAD)"
          test "$fetched_candidate" = "$CANDIDATE_SHA"
          git -C "$REPO_DIR" checkout --quiet --detach "$CANDIDATE_SHA"
          git -C "$REPO_DIR" fetch --no-tags --depth=1 fork "$BASE_SHA"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:src/cli/config-set-input.ts")" = "93eb1b71a98aa540ccf2791cc56dd0d3690b9723"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:src/cli/config-cli.integration.test.ts")" = "1617493ffa803d8123162e6d2ef57431b2b4769e"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:docs/cli/config.md")" = "6052a52170bf690792e879b503875b9cc45bca96"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:src/cli/config-set-input.ts")" = "41425074c115f55d65b5d70997d1e1c5664e8043"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:docs/cli/config.md")" = "873f3953e5dcb15d0d7682ddb52557f7899f4073"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:src/cli/config-cli.integration.test.ts")" = "7f9702496e9e2586f42bb5110bc7f5961a53baf5"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:config/test-lines-allocations/config-builder-empty-args-2026-10-29.txt")" = "87523dd7a0632907d61799465827c3f08825fa47"
          {
            printf 'Base SHA: %s\n' "$BASE_SHA"
            printf 'Candidate SHA: %s\n' "$CANDIDATE_SHA"
            printf 'Candidate ref: %s\n' "$CANDIDATE_REF"
            printf 'Node: %s\n' "$(node --version)"
          } | tee "$PROOF_DIR/manifest.txt"

      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          corepack enable
          printf 'pnpm: %s\n' "$(corepack pnpm --version)" | tee -a "$PROOF_DIR/manifest.txt"
          corepack pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Stage the repository-pinned Bun formatter
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$PROOF_DIR/bun" linux x64
          echo "$PROOF_DIR/bun/bin" >> "$GITHUB_PATH"
          "$PROOF_DIR/bun/bin/bun" --version | tee -a "$PROOF_DIR/manifest.txt"

      - name: Prove the regression fails with baseline production code
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          git show "$BASE_SHA:src/cli/config-set-input.ts" > src/cli/config-set-input.ts
          test "$(git hash-object src/cli/config-set-input.ts)" = "93eb1b71a98aa540ccf2791cc56dd0d3690b9723"
          set +e
          corepack pnpm test src/cli/config-cli.integration.test.ts --maxWorkers=1 --reporter=verbose > "$PROOF_DIR/base-red.log" 2>&1
          status=$?
          set -e
          cat "$PROOF_DIR/base-red.log"
          if [ "$status" -eq 0 ]; then
            echo 'Baseline unexpectedly passed the candidate regression tests.' >&2
            exit 1
          fi
          if ! grep -Fq 'empty --ref-provider' "$PROOF_DIR/base-red.log" || ! grep -Fq 'provider builder with empty ref flag' "$PROOF_DIR/base-red.log"; then
            echo 'Baseline failed without showing the expected empty-builder regression cases.' >&2
            exit 1
          fi
          node -e 'let s=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(s.replace(/\x1b\[[0-9;]*m/g, "")));' < "$PROOF_DIR/base-red.log" > "$PROOF_DIR/base-red.plain.log"
          if ! grep -Eq 'Tests[[:space:]]+15 failed([[:space:]]|$)' "$PROOF_DIR/base-red.plain.log"; then
            echo 'Baseline output did not show the exact expected 15 failing regression tests.' >&2
            exit 1
          fi
          printf 'PASS: baseline production blob failed the expected empty-builder cases (exit %s).\n' "$status" | tee -a "$PROOF_DIR/manifest.txt"

      - name: Prove the built baseline CLI performs the unintended write
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          corepack pnpm build
          cli_dir="$PROOF_DIR/cli-baseline"
          cli_home="$cli_dir/home"
          cli_state="$cli_dir/state"
          mkdir -p "$cli_home" "$cli_state" "$cli_dir/xdg-config" "$cli_dir/xdg-cache"
          config="$cli_state/openclaw.json"
          printf '{"agents":{"entries":{"main":{}}},"gateway":{"port":18789}}\n' > "$config"
          set +e
          env HOME="$cli_home" OPENCLAW_HOME="$cli_home" OPENCLAW_STATE_DIR="$cli_state" OPENCLAW_CONFIG_PATH="$config" XDG_CONFIG_HOME="$cli_dir/xdg-config" XDG_CACHE_HOME="$cli_dir/xdg-cache" node openclaw.mjs config set gateway.port 19001 --ref-id "" > "$cli_dir/result.log" 2>&1
          status=$?
          set -e
          cat "$cli_dir/result.log"
          if [ "$status" -ne 0 ]; then
            echo "Baseline built CLI did not reproduce the accidental write (exit $status)." >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.gateway?.port !== 19001) process.exit(1);' "$config"
          printf 'PASS: baseline built CLI treated the empty builder argument as value mode and wrote gateway.port=19001.\n' | tee -a "$PROOF_DIR/manifest.txt"

      - name: Restore and prove the exact candidate passes
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          git checkout --quiet "$CANDIDATE_SHA" -- src/cli/config-set-input.ts
          test "$(git hash-object src/cli/config-set-input.ts)" = "41425074c115f55d65b5d70997d1e1c5664e8043"
          corepack pnpm test src/cli/config-cli.integration.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$PROOF_DIR/candidate-green.log"
          node -e 'let s=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(s.replace(/\x1b\[[0-9;]*m/g, "")));' < "$PROOF_DIR/candidate-green.log" > "$PROOF_DIR/candidate-green.plain.log"
          if ! grep -Eq 'Tests[[:space:]]+[0-9]+ passed([[:space:]]|$)' "$PROOF_DIR/candidate-green.plain.log"; then
            echo 'Candidate output did not show a fully passing config CLI integration suite.' >&2
            exit 1
          fi
          corepack pnpm test src/cli/config-set-mode.test.ts src/cli/config-cli.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$PROOF_DIR/candidate-builder-controls.log"
          if ! grep -Fq 'selects ref_builder' "$PROOF_DIR/candidate-builder-controls.log" || ! grep -Fq 'keeps a quoted numeric record key distinct from an array-indexed secret target' "$PROOF_DIR/candidate-builder-controls.log" || ! grep -Fq 'supports provider builder mode under secrets.providers.<alias>' "$PROOF_DIR/candidate-builder-controls.log"; then
            echo 'Candidate builder control tests did not show the valid ref/provider positive cases.' >&2
            exit 1
          fi
          printf 'PASS: exact candidate passed valid nonempty SecretRef and provider builder mode controls.\n' | tee -a "$PROOF_DIR/manifest.txt"
          corepack pnpm build
          cli_dir="$PROOF_DIR/cli-candidate"
          cli_home="$cli_dir/home"
          cli_state="$cli_dir/state"
          mkdir -p "$cli_home" "$cli_state" "$cli_dir/xdg-config" "$cli_dir/xdg-cache"
          config="$cli_state/openclaw.json"
          original='{"agents":{"entries":{"main":{}}},"gateway":{"port":18789}}'
          printf '%s\n' "$original" > "$config"
          set +e
          env HOME="$cli_home" OPENCLAW_HOME="$cli_home" OPENCLAW_STATE_DIR="$cli_state" OPENCLAW_CONFIG_PATH="$config" XDG_CONFIG_HOME="$cli_dir/xdg-config" XDG_CACHE_HOME="$cli_dir/xdg-cache" node openclaw.mjs config set gateway.port 19001 --ref-id "" > "$cli_dir/result.log" 2>&1
          status=$?
          set -e
          cat "$cli_dir/result.log"
          if [ "$status" -eq 0 ]; then
            echo 'Candidate built CLI accepted an empty ref builder argument.' >&2
            exit 1
          fi
          if ! grep -Fq 'ref builder mode does not accept <value>' "$cli_dir/result.log"; then
            echo 'Candidate built CLI failed without the expected ref-builder diagnostic.' >&2
            exit 1
          fi
          test "$(cat "$config")" = "$original"
          printf 'PASS: exact candidate built CLI rejected the empty builder argument and preserved config bytes.\n' | tee -a "$PROOF_DIR/manifest.txt"
          set +e
          env HOME="$cli_home" OPENCLAW_HOME="$cli_home" OPENCLAW_STATE_DIR="$cli_state" OPENCLAW_CONFIG_PATH="$config" XDG_CONFIG_HOME="$cli_dir/xdg-config" XDG_CACHE_HOME="$cli_dir/xdg-cache" node openclaw.mjs config set gateway.port 19002 > "$cli_dir/positive-result.log" 2>&1
          positive_status=$?
          set -e
          cat "$cli_dir/positive-result.log"
          if [ "$positive_status" -ne 0 ]; then
            echo "Candidate built CLI rejected ordinary value mode (exit $positive_status)." >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.gateway?.port !== 19002) process.exit(1);' "$config"
          printf 'PASS: exact candidate built CLI accepted ordinary value mode and wrote gateway.port=19002.\n' | tee -a "$PROOF_DIR/manifest.txt"
          printf 'PASS: exact candidate production blob passed the full config CLI integration file.\n' | tee -a "$PROOF_DIR/manifest.txt"

      - name: Check final-head formatting, lint, types, and diff hygiene
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          corepack pnpm format:check src/cli/config-set-input.ts src/cli/config-cli.integration.test.ts docs/cli/config.md
          corepack pnpm lint --files-json '["src/cli/config-set-input.ts","src/cli/config-cli.integration.test.ts"]'
          corepack pnpm tsgo:core
          corepack pnpm check:test-lines-ratchet --base "$BASE_SHA" --no-merge-base
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          printf 'PASS: format, targeted lint, core typecheck, and diff checks on candidate %s.\n' "$CANDIDATE_SHA" | tee -a "$PROOF_DIR/manifest.txt"

      - name: Record verifiable proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Config builder empty-argument proof'
            echo
            echo "- Evidence workflow commit: $GITHUB_SHA"
            echo "- Baseline: $BASE_SHA (production blob 93eb1b71a98aa540ccf2791cc56dd0d3690b9723; test blob 1617493ffa803d8123162e6d2ef57431b2b4769e; docs blob 6052a52170bf690792e879b503875b9cc45bca96)"
            echo "- Candidate: $CANDIDATE_SHA (production blob 41425074c115f55d65b5d70997d1e1c5664e8043; test blob 7f9702496e9e2586f42bb5110bc7f5961a53baf5; docs blob 873f3953e5dcb15d0d7682ddb52557f7899f4073; test-line allocation blob 87523dd7a0632907d61799465827c3f08825fa47)"
            echo "- Runner: ubuntu-24.04 (GitHub-hosted standard public-repository runner)"
            echo '- Permissions: contents: read; no repository secrets, OIDC, environments, caches, or persisted checkout credentials.'
            echo '- Proof logs are retained with this Actions run; no separate artifact storage is requested.'
            echo
            if [ -f "$PROOF_DIR/manifest.txt" ]; then
              echo '```text'
              cat "$PROOF_DIR/manifest.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

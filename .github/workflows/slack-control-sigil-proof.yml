name: Slack control sigil boundary proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slack-control-sigil-boundary-proof
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'KhanCold/openclaw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: proof/slack-control-sigil
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.11.1
      - name: Compare frozen baseline and candidate at the Slack HTTP boundary
        run: node proof/slack-control-sigil/proof.mjs

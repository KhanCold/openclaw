name: plugins-init-current-main-proof-6a82

on:
  push:
    branches:
      - proof/plugins-init-expected-errors-current-main-6a82

permissions:
  contents: read

jobs:
  plugins-init-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE_SHA: 6a82c555d2d433e02b3a95c76e7414b0698ff186
      CANDIDATE_SHA: 655a88f2c69ae071286a5cc596327356a8fd7068
      CANDIDATE_REF: task/2026-11-02-plugin-init-expected-errors-current-main-6a82
      BASE_SOURCE_BLOB: edffcae5d0598349c883b82eabaf250c164f0f3a
      CANDIDATE_SOURCE_BLOB: ec46aecc9a48d1d2ecf921549684504cd996ad80
      TEST_BLOB: 936cd5763339888cb8d88a64935afa67dcbf450f
      ALLOCATION_BLOB: 8f92bfdd49766b1907d4aec8d3b0f9ed6129d0e6
      EXPECTED_TREE: d1c5b0633c5ed5c2d29ce336ad64dbbf82d78cd9
      PRIOR_CANDIDATE: 9662073b35b2a926ac9223596a445e51c0b8110c
      REPO_DIR: ${{ github.workspace }}/.proof-checkout
      PROOF_DIR: ${{ github.workspace }}/.proof-evidence
    steps:
      - name: Checkout proof branch without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: false

      - name: Fetch and verify exact baseline and candidate objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR" "$REPO_DIR"
          git -C "$REPO_DIR" init --quiet
          git -C "$REPO_DIR" remote add upstream https://github.com/openclaw/openclaw.git
          git -C "$REPO_DIR" remote add fork https://github.com/KhanCold/openclaw.git
          git -C "$REPO_DIR" fetch --no-tags --depth=1 upstream "$BASE_SHA"
          test "$(git -C "$REPO_DIR" rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git -C "$REPO_DIR" fetch --no-tags --depth=1 fork "refs/heads/$CANDIDATE_REF"
          test "$(git -C "$REPO_DIR" rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git -C "$REPO_DIR" checkout --quiet --detach "$CANDIDATE_SHA"
          candidate_headers="$(git -C "$REPO_DIR" cat-file -p "$CANDIDATE_SHA" | sed -n '1,/^$/p')"
          printf '%s\n' "$candidate_headers" | grep -Fxq "tree $EXPECTED_TREE"
          parent_lines="$(printf '%s\n' "$candidate_headers" | sed -n 's/^parent //p')"
          expected_parents="$(printf '%s\n%s' "$PRIOR_CANDIDATE" "$BASE_SHA")"
          test "$parent_lines" = "$expected_parents"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:src/cli/plugins-authoring-command.ts")" = "$BASE_SOURCE_BLOB"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:src/cli/plugins-authoring-command.ts")" = "$CANDIDATE_SOURCE_BLOB"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:src/cli/plugins-authoring.process.test.ts")" = "aa168066ddb53ca05afa22e0db26e6732d7c8967"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:src/cli/plugins-authoring.process.test.ts")" = "$TEST_BLOB"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:config/test-lines-allocations/plugins-init-expected-errors-2026-10-29.txt")" = "$ALLOCATION_BLOB"
          for path in package.json pnpm-lock.yaml; do
            test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:$path")" = "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:$path")"
          done
          expected_paths="$(printf '%s\n' \
            config/test-lines-allocations/plugins-init-expected-errors-2026-10-29.txt \
            src/cli/plugins-authoring-command.ts \
            src/cli/plugins-authoring.process.test.ts | LC_ALL=C sort)"
          actual_paths="$(git -C "$REPO_DIR" diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          git -C "$REPO_DIR" diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          {
            printf 'Base SHA: %s\n' "$BASE_SHA"
            printf 'Candidate SHA: %s\n' "$CANDIDATE_SHA"
            printf 'Candidate ref: %s\n' "$CANDIDATE_REF"
            printf 'Candidate tree: %s\n' "$EXPECTED_TREE"
            printf 'Candidate parents (ordered):\n%s\n' "$parent_lines"
            printf 'Changed paths:\n%s\n' "$actual_paths"
            printf 'Node: %s\n' "$(node --version)"
          } | tee "$PROOF_DIR/manifest.txt"

      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          corepack enable
          printf 'pnpm: %s\n' "$(corepack pnpm --version)" | tee -a "$PROOF_DIR/manifest.txt"
          corepack pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Stage the repository-pinned Bun formatter
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$PROOF_DIR/bun" linux x64
          echo "$PROOF_DIR/bun/bin" >> "$GITHUB_PATH"
          "$PROOF_DIR/bun/bin/bun" --version | tee -a "$PROOF_DIR/manifest.txt"

      - name: Prove new CLI error regressions fail on baseline
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          git show "$BASE_SHA:src/cli/plugins-authoring-command.ts" > src/cli/plugins-authoring-command.ts
          test "$(git hash-object src/cli/plugins-authoring-command.ts)" = "$BASE_SOURCE_BLOB"
          started_ms="$(date +%s%3N)"
          set +e
          corepack pnpm test src/cli/plugins-authoring.process.test.ts --maxWorkers=1 --reporter=verbose > "$PROOF_DIR/base-red.log" 2>&1
          exit_status=$?
          set -e
          elapsed_ms=$(( $(date +%s%3N) - started_ms ))
          printf 'Baseline focused test wall time: %s ms (exit %s)\n' "$elapsed_ms" "$exit_status" | tee -a "$PROOF_DIR/manifest.txt"
          node -e 'let s=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(s.replace(/\x1b\[[0-9;]*m/g, "")));' < "$PROOF_DIR/base-red.log" > "$PROOF_DIR/base-red.plain.log"
          cat "$PROOF_DIR/base-red.plain.log"
          test "$exit_status" -ne 0
          log="$PROOF_DIR/base-red.plain.log"
          expected_failures=(
            'reports invalid plugins init input: Supported types: tool, provider, feature'
            'reports invalid plugins init input: Plugin id is required.'
            'reports invalid plugins init input: Plugin display name is required.'
            'explains why init refuses an existing directory and preserves its contents'
          )
          for name in "${expected_failures[@]}"; do
            grep -Fq "FAIL   cli-process  src/cli/plugins-authoring.process.test.ts > $name" "$log"
          done
          failure_count="$(grep -Fc ' FAIL   cli-process  src/cli/plugins-authoring.process.test.ts > ' "$log")"
          test "$failure_count" -eq 4
          printf 'PASS: exact baseline source has precisely the four intended plugin-init diagnostic failures.\n' | tee -a "$PROOF_DIR/manifest.txt"

      - name: Prove the built baseline CLI hides the expected cause
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          corepack pnpm build
          cli_dir="$PROOF_DIR/cli-baseline"
          mkdir -p "$cli_dir/home" "$cli_dir/state" "$cli_dir/xdg-config" "$cli_dir/xdg-cache"
          config="$cli_dir/state/openclaw.json"
          printf '{"agents":{"entries":{"main":{}}},"gateway":{"port":18789}}\n' > "$config"
          set +e
          env -u NODE_ENV -u NODE_OPTIONS -u VITEST -u VITEST_POOL_ID -u VITEST_WORKER_ID HOME="$cli_dir/home" OPENCLAW_HOME="$cli_dir/home" OPENCLAW_STATE_DIR="$cli_dir/state" OPENCLAW_CONFIG_PATH="$config" XDG_CONFIG_HOME="$cli_dir/xdg-config" XDG_CACHE_HOME="$cli_dir/xdg-cache" OPENCLAW_NO_RESPAWN=1 OPENCLAW_HIDE_BANNER=1 NO_COLOR=1 node openclaw.mjs plugins init plugin-init-proof --directory "$cli_dir/project" --type invalid > "$cli_dir/stdout.log" 2> "$cli_dir/stderr.log"
          exit_status=$?
          set -e
          cat "$cli_dir/stderr.log"
          test "$exit_status" -eq 1
          grep -Fq '[openclaw] The CLI command failed.' "$cli_dir/stderr.log"
          grep -Fq 'openclaw doctor' "$cli_dir/stderr.log"
          ! grep -Fq 'Unsupported plugin scaffold type' "$cli_dir/stderr.log"
          test ! -e "$cli_dir/project"
          printf 'PASS: baseline built CLI hides invalid-type cause behind generic failure/Doctor output.\n' | tee -a "$PROOF_DIR/manifest.txt"

      - name: Prove candidate process tests and real CLI cases
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          git checkout --quiet "$CANDIDATE_SHA" -- src/cli/plugins-authoring-command.ts
          test "$(git hash-object src/cli/plugins-authoring-command.ts)" = "$CANDIDATE_SOURCE_BLOB"
          started_ms="$(date +%s%3N)"
          set +e
          corepack pnpm test src/cli/plugins-authoring.process.test.ts --maxWorkers=1 --reporter=verbose > "$PROOF_DIR/candidate-green.log" 2>&1
          exit_status=$?
          set -e
          elapsed_ms=$(( $(date +%s%3N) - started_ms ))
          printf 'Candidate focused test wall time: %s ms (exit %s)\n' "$elapsed_ms" "$exit_status" | tee -a "$PROOF_DIR/manifest.txt"
          cat "$PROOF_DIR/candidate-green.log"
          test "$exit_status" -eq 0
          corepack pnpm build
          run_case() {
            local name="$1"
            shift
            CASE_DIR="$PROOF_DIR/cli-candidate/$name"
            mkdir -p "$CASE_DIR/home" "$CASE_DIR/state" "$CASE_DIR/xdg-config" "$CASE_DIR/xdg-cache"
            printf '{"agents":{"entries":{"main":{}}},"gateway":{"port":18789}}\n' > "$CASE_DIR/state/openclaw.json"
            if env -u NODE_ENV -u NODE_OPTIONS -u VITEST -u VITEST_POOL_ID -u VITEST_WORKER_ID HOME="$CASE_DIR/home" OPENCLAW_HOME="$CASE_DIR/home" OPENCLAW_STATE_DIR="$CASE_DIR/state" OPENCLAW_CONFIG_PATH="$CASE_DIR/state/openclaw.json" XDG_CONFIG_HOME="$CASE_DIR/xdg-config" XDG_CACHE_HOME="$CASE_DIR/xdg-cache" OPENCLAW_NO_RESPAWN=1 OPENCLAW_HIDE_BANNER=1 NO_COLOR=1 node openclaw.mjs "$@" > "$CASE_DIR/stdout.log" 2> "$CASE_DIR/stderr.log"; then
              CASE_EXIT=0
            else
              CASE_EXIT=$?
            fi
          }
          run_case invalid-type plugins init plugin-init-proof --directory "$PROOF_DIR/cli-candidate/invalid-type/project" --type invalid
          test "$CASE_EXIT" -eq 1
          grep -Fq 'Unsupported plugin scaffold type' "$CASE_DIR/stderr.log"
          ! grep -Fq 'openclaw doctor' "$CASE_DIR/stderr.log"
          test ! -e "$PROOF_DIR/cli-candidate/invalid-type/project"
          run_case empty-id plugins init ' ' --directory "$PROOF_DIR/cli-candidate/empty-id/project"
          test "$CASE_EXIT" -eq 1
          grep -Fq 'Plugin id is required.' "$CASE_DIR/stderr.log"
          ! grep -Fq 'openclaw doctor' "$CASE_DIR/stderr.log"
          test ! -e "$PROOF_DIR/cli-candidate/empty-id/project"
          run_case empty-name plugins init plugin-init-proof --directory "$PROOF_DIR/cli-candidate/empty-name/project" --name ' '
          test "$CASE_EXIT" -eq 1
          grep -Fq 'Plugin display name is required.' "$CASE_DIR/stderr.log"
          ! grep -Fq 'openclaw doctor' "$CASE_DIR/stderr.log"
          test ! -e "$PROOF_DIR/cli-candidate/empty-name/project"
          existing_dir="$PROOF_DIR/cli-candidate/existing-path/project"
          mkdir -p "$existing_dir"
          printf 'preserve me\n' > "$existing_dir/keep.txt"
          run_case existing-path plugins init plugin-init-proof --directory "$existing_dir"
          test "$CASE_EXIT" -eq 1
          grep -Fq 'Refusing to overwrite existing path:' "$CASE_DIR/stderr.log"
          ! grep -Fq 'openclaw doctor' "$CASE_DIR/stderr.log"
          test "$(cat "$existing_dir/keep.txt")" = 'preserve me'
          run_case valid-init plugins init plugin-init-proof --directory "$PROOF_DIR/cli-candidate/valid-init/project"
          test "$CASE_EXIT" -eq 0
          node -e 'const fs=require("node:fs");const path=require("node:path");const d=process.argv[1];const m=JSON.parse(fs.readFileSync(path.join(d,"openclaw.plugin.json"),"utf8"));const p=JSON.parse(fs.readFileSync(path.join(d,"package.json"),"utf8"));if(m.id!=="plugin-init-proof"||p.name!=="openclaw-plugin-plugin-init-proof")process.exit(1);' "$PROOF_DIR/cli-candidate/valid-init/project"
          printf 'PASS: candidate tests/build, four built-CLI errors with readable reasons/no Doctor hint/no unwanted directory, existing-file preservation, and valid-init positive control.\n' | tee -a "$PROOF_DIR/manifest.txt"

      - name: Check candidate formatting lint types and ratchets
        shell: bash
        working-directory: ${{ github.workspace }}/.proof-checkout
        run: |
          set -euo pipefail
          corepack pnpm format:check src/cli/plugins-authoring-command.ts src/cli/plugins-authoring.process.test.ts
          corepack pnpm lint --files-json '["src/cli/plugins-authoring-command.ts","src/cli/plugins-authoring.process.test.ts"]'
          corepack pnpm tsgo:core
          corepack pnpm check:test-lines-ratchet --base "$BASE_SHA" --no-merge-base
          corepack pnpm check:line-cap-ratchet --base "$BASE_SHA" --no-merge-base
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          printf 'PASS: formatting parity, focused lint, core typecheck, test-line/line-cap ratchets and diff hygiene.\n' | tee -a "$PROOF_DIR/manifest.txt"

      - name: Record verifiable proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Current-main plugin init expected-error proof'
            echo
            echo "- Evidence workflow commit: $GITHUB_SHA"
            echo "- Baseline: $BASE_SHA (source blob $BASE_SOURCE_BLOB)"
            echo "- Candidate: $CANDIDATE_SHA (tree $EXPECTED_TREE; source $CANDIDATE_SOURCE_BLOB; test $TEST_BLOB; allocation $ALLOCATION_BLOB)"
            echo "- Candidate ref: KhanCold/openclaw:$CANDIDATE_REF"
            echo '- Runner: GitHub-hosted public ubuntu-24.04.'
            echo '- Permissions: contents: read; pinned actions; checkout credentials are not persisted. No repository secrets, OIDC, environments, cache actions, self-hosted runners, or artifact upload are used.'
            echo '- The workflow retrieves source from public upstream/fork refs and does not execute candidate code on the credentialed Mac.'
            echo
            if [ -f "$PROOF_DIR/manifest.txt" ]; then cat "$PROOF_DIR/manifest.txt"; fi
          } >> "$GITHUB_STEP_SUMMARY"

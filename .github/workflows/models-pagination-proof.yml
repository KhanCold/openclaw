name: Models pagination isolated proof
on:
  push:
    branches: [proof/models-pagination-head-20261017]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Anonymous pinned source checkout
        run: |
          git init "$GITHUB_WORKSPACE/source"
          cd "$GITHUB_WORKSPACE/source"
          git remote add origin https://github.com/KhanCold/openclaw.git
          git -c credential.helper= fetch --depth=3 origin e680022e7b5fdfbebd7901cf9ec000e7578749cc
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e680022e7b5fdfbebd7901cf9ec000e7578749cc
          test "$(git rev-parse HEAD^{tree})" = 20b81ea0921b5d2882e9bd6c53b35c5613e308f4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          token: ''
      - name: Pinned toolchain and frozen dependencies
        id: install
        working-directory: source
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          corepack prepare pnpm@12.11.1 --activate
          pnpm install --frozen-lockfile
          if ! command -v rg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ripgrep; fi
      - name: Identical focused regression and timing
        id: focused
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm test src/auto-reply/reply/commands-models.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/focused.log"
      - name: Build shipped Gateway and SDK
        id: build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS=openai /usr/bin/time -p pnpm exec node --import ./scripts/tsx.mjs scripts/build-all.mts cliStartup 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Materialize audited external synthetic fixture
        if: always() && steps.build.outcome == 'success'
        run: |
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/built-pagination-driver.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/module-observer.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/baseline-report.json"
          sha256sum "$RUNNER_TEMP/built-pagination-driver.mjs" "$RUNNER_TEMP/module-observer.mjs"
      - name: Actual built Gateway chat command proof
        id: runtime
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node "$RUNNER_TEMP/built-pagination-driver.mjs" "$PWD" head "$RUNNER_TEMP/models-pagination-proof" "$RUNNER_TEMP/baseline-report.json" 2>&1 | tee "$RUNNER_TEMP/runtime.log"
      - name: Inspect maintained changed scope
        id: plan
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node scripts/check-changed.mjs --dry-run --base d8b07e733e1f9caec48faf3852c7722aea606194 --head e680022e7b5fdfbebd7901cf9ec000e7578749cc 2>&1 | tee "$RUNNER_TEMP/plan.log"
      - name: Catalog order and recovery siblings
        id: siblings
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm test src/auto-reply/reply/commands-models-order.test.ts src/auto-reply/reply/commands-models.catalog-recovery.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/siblings.log"
      - name: Core production types
        id: types
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm tsgo:core 2>&1 | tee "$RUNNER_TEMP/types.log"
      - name: Canonical changed test type graphs
        id: testtypes
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/auto-reply/reply/commands-models.test.ts"]' 2>&1 | tee "$RUNNER_TEMP/testtypes.log"
      - name: Changed source and test lint
        id: lint
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/auto-reply/reply/commands-models.ts src/auto-reply/reply/commands-models.test.ts 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - name: Changed source and test format
        id: format
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm format:check -- src/auto-reply/reply/commands-models.ts src/auto-reply/reply/commands-models.test.ts 2>&1 | tee "$RUNNER_TEMP/format.log"
      - name: Retain actual outcomes
        if: always()
        run: |
          echo 'PAGINATION_PROOF_OUTCOMES focused=${{ steps.focused.outcome }} build=${{ steps.build.outcome }} runtime=${{ steps.runtime.outcome }} plan=${{ steps.plan.outcome }} siblings=${{ steps.siblings.outcome }} types=${{ steps.types.outcome }} testtypes=${{ steps.testtypes.outcome }} lint=${{ steps.lint.outcome }} format=${{ steps.format.outcome }}'
          if [ -f "$RUNNER_TEMP/models-pagination-proof/head/report.json" ]; then
            python3 -c 'import json,sys; print("PAGINATION_PROOF_RESULT_JSON="+json.dumps(json.load(open(sys.argv[1])),separators=(",",":")))' "$RUNNER_TEMP/models-pagination-proof/head/report.json"
          fi
          for f in "$RUNNER_TEMP/models-pagination-proof/head/gateway.stdout.log" "$RUNNER_TEMP/models-pagination-proof/head/gateway.stderr.log"; do
            if [ -f "$f" ]; then echo "PROOF_FILE=$f"; cat "$f"; fi
          done
          test "${{ steps.focused.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.runtime.outcome }}" = success
          test "${{ steps.plan.outcome }}" = success
          test "${{ steps.siblings.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.testtypes.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.format.outcome }}" = success

name: Models pagination isolated proof
on:
  push:
    branches: [proof/models-pagination-baseline-20261017]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Anonymous pinned source checkout
        run: |
          git init "$GITHUB_WORKSPACE/source"
          cd "$GITHUB_WORKSPACE/source"
          git remote add origin https://github.com/KhanCold/openclaw.git
          git -c credential.helper= fetch --depth=3 origin e520ccc98bcaa45a3834442f8141de075629639c
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e520ccc98bcaa45a3834442f8141de075629639c
          test "$(git rev-parse HEAD^{tree})" = 88f2323065cc2116f0141682f2951fbb46846154
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          token: ''
      - name: Pinned toolchain and frozen dependencies
        id: install
        working-directory: source
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          corepack prepare pnpm@12.11.1 --activate
          pnpm install --frozen-lockfile
          if ! command -v rg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ripgrep; fi
      - name: Identical focused regression and timing
        id: focused
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm test src/auto-reply/reply/commands-models.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/focused.log"
      - name: Build shipped Gateway and SDK
        id: build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS=openai /usr/bin/time -p pnpm exec node --import ./scripts/tsx.mjs scripts/build-all.mts cliStartup 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Materialize audited external synthetic fixture
        if: always() && steps.build.outcome == 'success'
        run: |
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/built-pagination-driver.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/module-observer.mjs"
          sha256sum "$RUNNER_TEMP/built-pagination-driver.mjs" "$RUNNER_TEMP/module-observer.mjs"
      - name: Actual built Gateway chat command proof
        id: runtime
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node "$RUNNER_TEMP/built-pagination-driver.mjs" "$PWD" baseline "$RUNNER_TEMP/models-pagination-proof" 2>&1 | tee "$RUNNER_TEMP/runtime.log"
      - name: Retain actual outcomes
        if: always()
        run: |
          echo 'PAGINATION_PROOF_OUTCOMES focused=${{ steps.focused.outcome }} build=${{ steps.build.outcome }} runtime=${{ steps.runtime.outcome }}'
          if [ -f "$RUNNER_TEMP/models-pagination-proof/baseline/report.json" ]; then
            python3 -c 'import json,sys; print("PAGINATION_PROOF_RESULT_JSON="+json.dumps(json.load(open(sys.argv[1])),separators=(",",":")))' "$RUNNER_TEMP/models-pagination-proof/baseline/report.json"
          fi
          for f in "$RUNNER_TEMP/models-pagination-proof/baseline/gateway.stdout.log" "$RUNNER_TEMP/models-pagination-proof/baseline/gateway.stderr.log"; do
            if [ -f "$f" ]; then echo "PROOF_FILE=$f"; cat "$f"; fi
          done
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.focused.outcome }}" = failure
          test "${{ steps.runtime.outcome }}" = failure
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert not d.get("blocker") and d["failed"] > 0' "$RUNNER_TEMP/models-pagination-proof/baseline/report.json"

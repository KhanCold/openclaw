name: Google Meet export isolated proof
on:
  push:
    branches: ["proof/google-meet-export-head-20261017"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Anonymous pinned source checkout
        run: |
          git init "$GITHUB_WORKSPACE/source"
          cd "$GITHUB_WORKSPACE/source"
          git remote add origin https://github.com/KhanCold/openclaw.git
          git -c credential.helper= fetch --depth=3 origin e913081d53ee2f02ce04de5bae91ecad3f491118
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "e913081d53ee2f02ce04de5bae91ecad3f491118"
          test "$(git rev-parse HEAD^{tree})" = "425b013ddb9e89fb3ff0f63156cc2978c6a3b118"
          git status --short
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
          package-manager-cache: false
          token: ""
      - name: Install pinned toolchain and dependencies
        id: install
        working-directory: source
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          corepack prepare pnpm@12.11.1 --activate
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
          if ! command -v rg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ripgrep; fi
      - name: Required Google Meet extension lane
        id: extension
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm test:extension google-meet 2>&1 | tee "$RUNNER_TEMP/extension.log"
      - name: Focused unchanged regression timing
        id: focused
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p pnpm test extensions/google-meet/src/cli-artifacts.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/focused.log"
      - name: Build shipped CLI with selected Google Meet plugin
        id: build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: |
          OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS=google-meet /usr/bin/time -p pnpm exec node --import ./scripts/tsx.mjs scripts/build-all.mts cliStartup 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Materialize reviewed external synthetic fixture
        if: always() && steps.build.outcome == 'success'
        run: |
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/built-export-driver.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/built-export-preload.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/baseline-report.json"
          sha256sum "$RUNNER_TEMP/built-export-driver.mjs" "$RUNNER_TEMP/built-export-preload.mjs"
      - name: Built shipped CLI export reproduction
        id: runtime
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node "$RUNNER_TEMP/built-export-driver.mjs" "$PWD" head "$RUNNER_TEMP/meet-export-proof" "$RUNNER_TEMP/baseline-report.json" 2>&1 | tee "$RUNNER_TEMP/runtime.log"
      - name: Targeted changed-file checks
        id: checks
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: /usr/bin/time -p node scripts/check-changed.mjs --base a98802ebaf88e496fcd1e2cdf2a5ac82a2f9e93e --head e913081d53ee2f02ce04de5bae91ecad3f491118 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - name: Retain sanitized evidence and exact outcomes
        if: always()
        run: |
          echo 'PROOF_OUTCOMES extension=${{ steps.extension.outcome }} focused=${{ steps.focused.outcome }} build=${{ steps.build.outcome }} runtime=${{ steps.runtime.outcome }} checks=${{ steps.checks.outcome }}'
          if [ -f "$RUNNER_TEMP/meet-export-proof/head/report.json" ]; then
            python3 -c 'import json,sys; print("MEET_PROOF_RESULT_JSON="+json.dumps(json.load(open(sys.argv[1])),separators=(",",":")))' "$RUNNER_TEMP/meet-export-proof/head/report.json"
            for f in "$RUNNER_TEMP/meet-export-proof/head"/*/export/transcript.md "$RUNNER_TEMP/meet-export-proof/head"/*/stderr.log; do
              echo "PROOF_FILE=$f"
              cat "$f"
            done
          fi
          test "${{ steps.extension.outcome }}" = success
          test "${{ steps.focused.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.runtime.outcome }}" = success
          test "${{ steps.checks.outcome }}" = success

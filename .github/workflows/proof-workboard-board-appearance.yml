name: Workboard appearance evidence
on:
  push:
    branches: [proof/workboard-board-appearance]
permissions:
  contents: read
jobs:
  behavior:
    if: github.repository == 'KhanCold/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      COREPACK_HOME: /tmp/openclaw-workboard-appearance-corepack
    steps:
      - name: Anonymous immutable candidate checkout
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --depth=8 https://github.com/KhanCold/openclaw.git b7d88c7da40ee8840cd5435b12b7fde542492bd3
          test "$(git rev-parse FETCH_HEAD^{tree})" = 1d8e0df273d49eddd003ef0e719a682f9a6c1d5b
          git checkout --detach b7d88c7da40ee8840cd5435b12b7fde542492bd3
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git 75a5207363f0a82c974a7ec5ac22644635897874
          git merge-base --is-ancestor 75a5207363f0a82c974a7ec5ac22644635897874 b7d88c7da40ee8840cd5435b12b7fde542492bd3
          test -z "$(git config --get-regexp 'http\..*extraheader|credential.helper' || true)"
      - name: Pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Pinned package manager
        run: |
          npm install --global --ignore-scripts corepack@0.34.6
          corepack enable
          pnpm --version
      - name: Independent physical dependency install
        run: pnpm install --frozen-lockfile
      - name: Final unchanged baseline and candidate proof
        run: |
          cat > /tmp/openclaw-workboard-proof-driver.mjs <<'PROOF_DRIVER'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { createHash } from "node:crypto";
          import { spawnSync } from "node:child_process";
          
          const base = "75a5207363f0a82c974a7ec5ac22644635897874";
          const candidate = "b7d88c7da40ee8840cd5435b12b7fde542492bd3";
          const test = "extensions/workboard/src/tools-board-appearance.test.ts";
          const bytes = fs.readFileSync(test);
          const testHash = createHash("sha256").update(bytes).digest("hex");
          function run(label, command, args, allowFailure = false) {
            const started = performance.now();
            const result = spawnSync(command, args, {
              env: process.env, encoding: "utf8", maxBuffer: 128 * 1024 * 1024,
              timeout: 35 * 60 * 1000,
            });
            process.stdout.write(result.stdout ?? "");
            process.stderr.write(result.stderr ?? "");
            console.log("PROOF_TIMING", JSON.stringify({ label, seconds: (performance.now() - started) / 1000, status: result.status }));
            assert.equal(result.error, undefined, `${label}: ${result.error}`);
            if (!allowFailure) assert.equal(result.status, 0, `${label} failed`);
            return result;
          }
          function focused(phase, baseline) {
            assert.deepEqual(fs.readFileSync(test), bytes, "unchanged regression bytes");
            const output = `/tmp/workboard-appearance-${phase}.json`;
            const result = run(`${phase} registered tool regression`, "pnpm", ["test", test, "--maxWorkers=1", "--reporter=default", "--reporter=json", `--outputFile.json=${output}`], baseline);
            const report = JSON.parse(fs.readFileSync(output, "utf8"));
            const assertions = report.testResults.flatMap(file => file.assertionResults);
            const failures = assertions.filter(item => item.status === "failed");
            assert.equal(assertions.length, 7, "all seven contract scenarios collected");
            assert.equal(result.status, baseline ? 1 : 0);
            assert.equal(failures.length, baseline ? 5 : 0);
            assert.ok(assertions.every(item => item.status === "passed" || item.status === "failed"));
            if (baseline) {
              assert.equal(failures.filter(item => item.title.startsWith("clears ")).length, 4);
              assert.ok(failures.some(item => item.title === "preserves appearance when the clear list is empty"));
              for (const item of failures) {
                assert.match(item.failureMessages.join("\n"), /Validation failed for tool "workboard_board_create"/);
                assert.match(item.failureMessages.join("\n"), /clearAppearance/);
              }
              for (const title of ["preserves appearance when fields are omitted or empty", "rejects invalid clear fields and types before executing a board update"]) {
                assert.ok(assertions.some(item => item.title === title && item.status === "passed"));
              }
            }
            console.log("PROOF_CASES", JSON.stringify({ phase, testHash, cases: assertions.map(item => ({ name: item.fullName, status: item.status, duration: item.duration, failures: item.failureMessages })) }));
          }
          console.log("PROOF_IDENTITIES", JSON.stringify({ base, candidate, workflow: process.env.GITHUB_SHA, testHash }));
          assert.equal(run("head identity", "git", ["rev-parse", "HEAD"]).stdout.trim(), candidate);
          run("baseline checkout", "git", ["checkout", "--detach", base]);
          fs.writeFileSync(test, bytes);
          run("baseline production untouched", "git", ["diff", "--exit-code", base]);
          focused("baseline", true);
          fs.unlinkSync(test);
          run("candidate checkout", "git", ["checkout", "--detach", candidate]);
          run("candidate exact tree", "git", ["diff", "--exit-code", candidate]);
          focused("head", false);
          console.log("REUSED_BROADER_PROOF", JSON.stringify({ run: 38917125935, candidate: "48aca9512fcf33ba75093d8d1e95d9705d58c7c9", reason: "Only SDK type annotation and canonical whitespace changed since full Workboard lane passed" }));
          run("whitespace", "git", ["diff", "--check", base, candidate]);
          console.log("PROOF_COMPLETE", JSON.stringify({ base, candidate, testHash }));
          PROOF_DRIVER
          node /tmp/openclaw-workboard-proof-driver.mjs
  checks:
    if: github.repository == 'KhanCold/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      COREPACK_HOME: /tmp/openclaw-workboard-appearance-corepack
    steps:
      - name: Anonymous immutable candidate checkout
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --depth=8 https://github.com/KhanCold/openclaw.git b7d88c7da40ee8840cd5435b12b7fde542492bd3
          test "$(git rev-parse FETCH_HEAD^{tree})" = 1d8e0df273d49eddd003ef0e719a682f9a6c1d5b
          git checkout --detach b7d88c7da40ee8840cd5435b12b7fde542492bd3
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git 75a5207363f0a82c974a7ec5ac22644635897874
          git merge-base --is-ancestor 75a5207363f0a82c974a7ec5ac22644635897874 b7d88c7da40ee8840cd5435b12b7fde542492bd3
          test -z "$(git config --get-regexp 'http\..*extraheader|credential.helper' || true)"
      - name: Pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Pinned package manager
        run: |
          npm install --global --ignore-scripts corepack@0.34.6
          corepack enable
          pnpm --version
      - name: Independent physical dependency install
        run: pnpm install --frozen-lockfile
      - name: Required runner tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          rg --version
      - name: Changed-file format
        run: pnpm format:check extensions/workboard/src/tools-board-appearance.test.ts extensions/workboard/src/tools-orchestration.ts
      - name: Production extension typecheck
        run: node scripts/run-tsgo.mjs -p tsconfig.extensions.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/extensions.tsbuildinfo
      - name: Extension test typecheck
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.extensions.test.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/extensions-test.tsbuildinfo
      - name: Changed-file extension lint
        run: node scripts/run-oxlint.mjs --tsconfig extensions/tsconfig.json extensions/workboard/src/tools-board-appearance.test.ts extensions/workboard/src/tools-orchestration.ts
      - name: SQLite worker ratchet with required tooling
        run: node --max-old-space-size=4096 --import ./scripts/tsx.mjs scripts/check-database-worker-ratchet.mts --base 75a5207363f0a82c974a7ec5ac22644635897874
      - name: Proof workflow guards
        run: |
          curl --fail --location --max-time 60 --silent --show-error "https://raw.githubusercontent.com/KhanCold/openclaw/$GITHUB_SHA/.github/workflows/proof-workboard-board-appearance.yml" --output .github/workflows/proof-workboard-board-appearance.yml
          pnpm check:workflows
      - name: Final whitespace
        run: git diff --check 75a5207363f0a82c974a7ec5ac22644635897874 b7d88c7da40ee8840cd5435b12b7fde542492bd3

name: Workboard appearance evidence
on:
  push:
    branches: [proof/workboard-board-appearance]
permissions:
  contents: read
jobs:
  prepare_checks:
    if: github.repository == 'KhanCold/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      COREPACK_HOME: /tmp/openclaw-workboard-appearance-corepack
    steps:
      - name: Anonymous immutable candidate checkout
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --depth=4 https://github.com/KhanCold/openclaw.git 20f6592dc3ed035bcf5199c038d1dc9fa849ffaa
          test "$(git rev-parse FETCH_HEAD^{tree})" = ede591be266b9a118cefbbf2e097fa082f5e5f52
          git checkout --detach 20f6592dc3ed035bcf5199c038d1dc9fa849ffaa
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git 75a5207363f0a82c974a7ec5ac22644635897874
          test -z "$(git config --get-regexp 'http\..*extraheader|credential.helper' || true)"
      - name: Pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Pinned package manager
        run: |
          npm install --global --ignore-scripts corepack@0.34.6
          corepack enable
          pnpm --version
      - name: Independent physical dependency install
        run: pnpm install --frozen-lockfile
      - name: Canonical formatter output for review
        run: |
          pnpm format extensions/workboard/src/tools-board-appearance.test.ts
          git diff -- extensions/workboard/src/tools-board-appearance.test.ts
          python3 - <<'PYFORMAT'
          import base64, pathlib, hashlib
          data = pathlib.Path('extensions/workboard/src/tools-board-appearance.test.ts').read_bytes()
          print('FORMATTED_TEST_SHA256=' + hashlib.sha256(data).hexdigest())
          print('FORMATTED_TEST_BASE64=' + base64.b64encode(data).decode())
          PYFORMAT
      - name: Baseline inherited diagnostic classification
        run: |
          git restore extensions/workboard/src/tools-board-appearance.test.ts
          git checkout --detach 75a5207363f0a82c974a7ec5ac22644635897874
          node --import ./scripts/tsx.mjs scripts/check-max-lines-ratchet.mts --base HEAD
          set +e
          node --import tsx scripts/check-deadcode-exports.mts
          result=$?
          echo "BASELINE_DEADCODE_EXIT=$result"
          test "$result" -eq 1

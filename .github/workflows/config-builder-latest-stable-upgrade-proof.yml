name: config-builder-latest-stable-upgrade-proof

on:
  push:
    branches:
      - proof/config-builder-stable-upgrade-2026-11-02

permissions:
  contents: read

jobs:
  latest-stable-upgrade:
    name: Published latest-stable to candidate upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE_SHA: 1347e901fce121a46962b706baa0f61f09f87860
      CANDIDATE_SHA: 9f1496bfd6ac846d0565fc259123d8af6284beb5
      CANDIDATE_REF: task/2026-11-02-config-builder-empty-args-current-main
      STABLE_SPEC: openclaw@2026.10.9
      REPO_DIR: ${{ github.workspace }}/.upgrade-checkout
    steps:
      - name: Checkout proof branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: false
          package-manager-cache: false

      - name: Fetch and verify exact baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPO_DIR"
          git -C "$REPO_DIR" init --quiet
          git -C "$REPO_DIR" remote add fork https://github.com/KhanCold/openclaw.git
          git -C "$REPO_DIR" fetch --no-tags --depth=1 fork "refs/heads/$CANDIDATE_REF"
          test "$(git -C "$REPO_DIR" rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git -C "$REPO_DIR" checkout --quiet --detach "$CANDIDATE_SHA"
          git -C "$REPO_DIR" fetch --no-tags --depth=1 fork "$BASE_SHA"
          test "$(git -C "$REPO_DIR" show -s --format=%P "$CANDIDATE_SHA")" = "$BASE_SHA"
          test "$(git -C "$REPO_DIR" rev-parse "$BASE_SHA:src/cli/config-set-input.ts")" = "93eb1b71a98aa540ccf2791cc56dd0d3690b9723"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:src/cli/config-set-input.ts")" = "41425074c115f55d65b5d70997e1c5664e8043"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:src/cli/config-cli.integration.test.ts")" = "7f9702496e9e2586f42bb5110bc7f5961a53baf5"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:docs/cli/config.md")" = "873f3953e5dcb15d0d7682ddb52557f7899f4073"
          test "$(git -C "$REPO_DIR" rev-parse "$CANDIDATE_SHA:config/test-lines-allocations/config-builder-empty-args-2026-10-29.txt")" = "87523dd7a0632907d61799465827c3f08825fa47"
          printf 'base=%s\ncandidate=%s\nstable=%s\nnode=%s\n' "$BASE_SHA" "$CANDIDATE_SHA" "$STABLE_SPEC" "$(node --version)"

      - name: Install locked candidate dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          corepack enable
          printf 'pnpm=%s\n' "$(corepack pnpm --version)"
          corepack pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Build exact candidate package
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          corepack pnpm build

      - name: Upgrade from published latest stable
        shell: bash
        env:
          OPENCLAW_UPGRADE_SURVIVOR_PUBLISHED_BASELINE: "1"
          OPENCLAW_UPGRADE_SURVIVOR_BASELINE_SPEC: openclaw@2026.10.9
          OPENCLAW_UPGRADE_SURVIVOR_SCENARIO: base
          OPENCLAW_UPGRADE_SURVIVOR_CANDIDATE: current
          OPENCLAW_UPGRADE_SURVIVOR_DOCKER_RUN_TIMEOUT: 1500s
          OPENCLAW_UPGRADE_SURVIVOR_LIVE_MODELS: ""
          OPENCLAW_UPGRADE_SURVIVOR_LIVE_OPENAI: "0"
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          docker info
          corepack pnpm test:docker:published-upgrade-survivor

      - name: Record proof inputs and result
        if: always()
        shell: bash
        run: |
          {
            echo '# Config builder latest-stable upgrade proof'
            echo
            echo "- Workflow commit: $GITHUB_SHA"
            echo "- Baseline: $BASE_SHA"
            echo "- Candidate: $CANDIDATE_SHA"
            echo "- Published baseline: $STABLE_SPEC"
            echo '- Scenario: base, official published-upgrade-survivor command; no live-model variables supplied.'
            echo '- Runner: ubuntu-24.04; permissions: contents: read; checkout credentials not persisted; package-manager cache disabled; no secrets/OIDC/environments/self-hosted runner.'
          } >> "$GITHUB_STEP_SUMMARY"

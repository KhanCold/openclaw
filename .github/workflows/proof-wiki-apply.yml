name: Memory Wiki final formatting evidence
on:
  push:
    branches: [proof/wiki-apply]
permissions:
  contents: read
jobs:
  final-format:
    if: github.repository == 'KhanCold/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      COREPACK_HOME: /tmp/openclaw-wiki-apply-corepack
    steps:
      - name: Anonymous immutable source checkout
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --depth=8 https://github.com/KhanCold/openclaw.git 7b8531758a3fff16d3261baab0ab693089820b1a
          test "$(git rev-parse FETCH_HEAD^{tree})" = 9f20fc1b938091b176fe1d4c4fc126390a3866a6
          git checkout --detach 7b8531758a3fff16d3261baab0ab693089820b1a
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git 02f671cd22a7b4be9aca038ce5bc1d4a58b3809c
          git merge-base --is-ancestor 02f671cd22a7b4be9aca038ce5bc1d4a58b3809c 7b8531758a3fff16d3261baab0ab693089820b1a
          test -z "$(git config --get-regexp 'http\..*extraheader|credential.helper' || true)"
      - name: Pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Pinned package manager
        run: |
          npm install --global --ignore-scripts corepack@0.34.6
          corepack enable
          pnpm --version
      - name: Independent physical dependency install
        run: pnpm install --frozen-lockfile
      - name: Verify final formatting and preserved source
        run: |
          set -euo pipefail
          pnpm format:check extensions/memory-wiki/src/cli.ts extensions/memory-wiki/src/gateway.ts extensions/memory-wiki/src/source-sync.ts extensions/memory-wiki/src/tool.ts extensions/memory-wiki/src/gateway.test.ts extensions/memory-wiki/src/apply-entrypoints.compile.test.ts
          git diff --check 02f671cd22a7b4be9aca038ce5bc1d4a58b3809c 7b8531758a3fff16d3261baab0ab693089820b1a
          git diff --exit-code
          sha256sum extensions/memory-wiki/src/apply-entrypoints.compile.test.ts extensions/memory-wiki/src/source-sync.ts
          curl --fail --location --silent --show-error --max-time 60 "https://raw.githubusercontent.com/KhanCold/openclaw/${GITHUB_SHA}/.github/workflows/proof-wiki-apply.yml" --output .github/workflows/proof-wiki-apply.yml
          pnpm check:workflows

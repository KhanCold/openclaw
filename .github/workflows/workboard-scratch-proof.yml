name: Workboard Scratch Prompt Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Baseline entry point must expose retained path
            subject_sha: 28f97f236f882af739aac9f0e6e77d83b2da2a7c
            expected: baseline
          - label: Candidate entry point must omit retained path
            subject_sha: 65ec5109d48f1a77f168bb99776a1ae7bf6a56a1
            expected: candidate
    steps:
      - name: Checkout proof harness and workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout fixed source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.subject_sha }}
          path: subject
          persist-credentials: false
          fetch-depth: 3
      - name: Verify source revision and install CLI proof harness
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C subject rev-parse HEAD)"
          test "$actual" = "${{ matrix.subject_sha }}"
          install -D proof/scripts/workboard-scratch-cli-proof.mjs \
            subject/scripts/workboard-scratch-cli-proof.mjs
          printf 'Source SHA: %s\n' "$actual"
          printf 'Proof harness SHA: %s\n' "$(git -C proof rev-parse HEAD)"
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install frozen dependencies without lifecycle scripts or cache
        working-directory: subject
        shell: bash
        run: |
          npm install --global pnpm@12.11.1
          test "$(pnpm --version)" = "12.11.1"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the CLI from the fixed source revision
        working-directory: subject
        run: pnpm build
      - name: Prove CLI-started Gateway worktree-to-scratch behavior
        working-directory: subject
        shell: bash
        env:
          WORKBOARD_PROOF_EXPECTED: ${{ matrix.expected }}
        run: |
          node --import ./scripts/tsx.mjs scripts/workboard-scratch-cli-proof.mjs

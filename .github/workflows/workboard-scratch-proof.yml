name: Workboard Scratch Prompt Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Baseline entry point must expose retained path
            subject_sha: 28f97f236f882af739aac9f0e6e77d83b2da2a7c
            expected: baseline
          - label: Candidate entry point must omit retained path
            subject_sha: 65ec5109d48f1a77f168bb99776a1ae7bf6a56a1
            expected: candidate
    steps:
      - name: Checkout proof harness and workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout fixed source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.subject_sha }}
          path: subject
          persist-credentials: false
          fetch-depth: 3
      - name: Verify source revision and install proof harness
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C subject rev-parse HEAD)"
          test "$actual" = "${{ matrix.subject_sha }}"
          install -D proof/src/gateway/gateway.server-workboard-scratch-prompt.test.ts \
            subject/src/gateway/gateway.server-workboard-scratch-prompt.test.ts
          printf 'Source SHA: %s\n' "$actual"
          printf 'Proof harness SHA: %s\n' "$(git -C proof rev-parse HEAD)"
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install frozen dependencies without lifecycle scripts or cache
        working-directory: subject
        shell: bash
        run: |
          npm install --global pnpm@12.11.1
          test "$(pnpm --version)" = "12.11.1"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove fixed baseline fails only on retained scratch path
        if: matrix.expected == 'baseline'
        working-directory: subject
        shell: bash
        run: |
          set +e
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.gateway-server.config.ts \
            src/gateway/gateway.server-workboard-scratch-prompt.test.ts \
            --maxWorkers=1 \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/workboard-entrypoint-baseline.json"
          test_status=$?
          set -e
          if [[ "$test_status" -eq 0 ]]; then
            echo 'Baseline unexpectedly passed the shipped-entry-point proof.' >&2
            exit 1
          fi
          node --input-type=module - "$RUNNER_TEMP/workboard-entrypoint-baseline.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const results = report.testResults ?? [];
          const failed = results.flatMap((result) =>
            (result.assertionResults ?? []).filter((assertion) => assertion.status === "failed"),
          );
          const failureText = failed.flatMap((assertion) => assertion.failureMessages ?? []).join("\n");
          if (
            report.numFailedTests !== 1 ||
            report.numPassedTests !== 0 ||
            results.length !== 1 ||
            results[0].status !== "failed" ||
            failed.length !== 1 ||
            !failed[0].fullName.endsWith("ships a scratch worker prompt through the real Gateway Workboard dispatch path") ||
            !failureText.includes("WORKBOARD_SCRATCH_RETAINED_PATH_PRESENT")
          ) {
            throw new Error("Baseline failed outside the intended retained-path assertion.");
          }
          console.log("Expected baseline red: real Gateway dispatch sent the synthetic retained path to the local model stub.");
          NODE
      - name: Prove fixed candidate omits retained path at the Gateway entry point
        if: matrix.expected == 'candidate'
        working-directory: subject
        shell: bash
        run: |
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.gateway-server.config.ts \
            src/gateway/gateway.server-workboard-scratch-prompt.test.ts \
            --maxWorkers=1

name: Issue 126850 Scoped Static Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1040bb40ee5751d63800dfb3c49b71701dd661a1
          fetch-depth: 10
          persist-credentials: false
      - name: Verify candidate and base
        run: |
          test "$(git rev-parse HEAD)" = 1040bb40ee5751d63800dfb3c49b71701dd661a1
          git cat-file -e 110914e51c486fbfd885284b7b5e31c7d373f125^{commit}
          git merge-base --is-ancestor 110914e51c486fbfd885284b7b5e31c7d373f125 HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install frozen dependencies without scripts
        run: |
          npm install --global pnpm@12.11.1
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Scoped format, lint and types
        run: |
          git diff --check 110914e51c486fbfd885284b7b5e31c7d373f125 HEAD
          node scripts/check-changed.mjs --base 110914e51c486fbfd885284b7b5e31c7d373f125 --head HEAD --timed

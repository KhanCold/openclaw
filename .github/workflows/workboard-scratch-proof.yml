name: Issue 176223 Isolated Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f01290d3ade52c2b240e9578957db86db1064040
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install frozen physical dependencies
        run: |
          npm install --global pnpm@12.11.1
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove expected baseline failure at actual tool entry
        env:
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set +e
          pnpm test extensions/workboard/src/tools.test.ts --maxWorkers=1 --testNamePattern 'refreshes diagnostics without making inactive cards look edited' > "$RUNNER_TEMP/baseline.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$status" -eq 1
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'baseline.log').read_text()
          assert 'AssertionError' in text and 'updatedAt' in text, 'not the expected product failure'
          assert '1 failed' in text, 'expected one failed regression'
          PY

name: Claude loopback feasibility 192735
on:
  push:
    branches: [proof/192735-claude-loopback-20261104]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install pinned public Claude Code
        run: |
          node --version
          npm install --prefix "$RUNNER_TEMP/claude-proof" --no-audit --no-fund @anthropic-ai/claude-code@2.1.222
      - name: Exercise real CLI against a synthetic local endpoint
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import http.server, threading, subprocess, tempfile, os, json
          class Handler(http.server.BaseHTTPRequestHandler):
              calls=[]
              def log_message(self, *args): pass
              def do_POST(self):
                  n=int(self.headers.get('Content-Length','0')); self.rfile.read(n)
                  self.calls.append(self.path)
                  events=[{'type':'message_start','message':{'id':'msg_synthetic','type':'message','role':'assistant','model':'claude-sonnet-4-5','content':[],'stop_reason':None,'stop_sequence':None,'usage':{'input_tokens':10,'output_tokens':1}}},{'type':'content_block_start','index':0,'content_block':{'type':'text','text':''}},{'type':'content_block_delta','index':0,'delta':{'type':'text_delta','text':'SYNTHETIC_OK'}},{'type':'content_block_stop','index':0},{'type':'message_delta','delta':{'stop_reason':'end_turn','stop_sequence':None},'usage':{'output_tokens':3}},{'type':'message_stop'}]
                  data=''.join('event: '+e['type']+'\n'+'data: '+json.dumps(e)+'\n\n' for e in events).encode()
                  self.send_response(200); self.send_header('Content-Type','text/event-stream'); self.send_header('Content-Length',str(len(data))); self.end_headers(); self.wfile.write(data)
          with tempfile.TemporaryDirectory(prefix='oc-claude-proof-') as t:
              server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler)
              threading.Thread(target=server.serve_forever,daemon=True).start()
              env={'PATH':os.environ['PATH'],'HOME':t,'CLAUDE_CONFIG_DIR':t,'ANTHROPIC_API_KEY':'synthetic-test-key','ANTHROPIC_BASE_URL':'http://127.0.0.1:'+str(server.server_port),'CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC':'1','DISABLE_TELEMETRY':'1'}
              try:
                  exe=os.path.join(os.environ['RUNNER_TEMP'],'claude-proof','node_modules','.bin','claude')
                  p=subprocess.run([exe,'--bare','--print','--model','claude-sonnet-4-5','--tools','','--output-format','json','Say hello'],cwd=t,env=env,text=True,capture_output=True,timeout=90)
                  summary={'exit':p.returncode,'local_requests':len(Handler.calls),'request_paths':Handler.calls,'synthetic_marker':'SYNTHETIC_OK' in p.stdout,'stderr_tail':p.stderr[-500:]}
                  print(json.dumps(summary))
                  if p.returncode != 0 or not Handler.calls or 'SYNTHETIC_OK' not in p.stdout: raise SystemExit(1)
              finally:
                  server.shutdown(); server.server_close()
          PY
          python3 "$RUNNER_TEMP/probe.py"

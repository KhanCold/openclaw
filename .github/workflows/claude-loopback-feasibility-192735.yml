name: Claude CLI local-model feasibility 192735
on:
  push:
    branches: [proof/192735-claude-loopback-20261104]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch checksum-pinned public llama.cpp CPU binary
        shell: bash
        run: |
          curl --fail --location --max-time 120 -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-ubuntu-x64.tar.gz
          echo "368227edcc229be5f9bed16a2223d79b5e41d0ac2e19bcf5825e82291c060e55  $RUNNER_TEMP/llama.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/llama-bin"
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/llama-bin"
      - name: Fetch checksum-pinned public model and CLI
        shell: bash
        run: |
          curl --fail --location --max-time 300 -o "$RUNNER_TEMP/model.gguf" https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/62a8d092b0a1047016f3edbd0fde387598727aa5/qwen2.5-1.5b-instruct-q4_k_m.gguf
          echo "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  $RUNNER_TEMP/model.gguf" | sha256sum --check
          npm install --prefix "$RUNNER_TEMP/claude-proof" --no-audit --no-fund @anthropic-ai/claude-code@2.1.222
      - name: Exercise real CLI and local model
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, pathlib, subprocess, tempfile, time, urllib.request
          with tempfile.TemporaryDirectory(prefix='oc-local-model-') as t:
              candidates=list(pathlib.Path(os.environ['RUNNER_TEMP'],'llama-bin').rglob('llama-server'))
              if len(candidates)!=1: raise RuntimeError('expected one llama-server executable')
              server_path=str(candidates[0])
              model=os.path.join(os.environ['RUNNER_TEMP'],'model.gguf')
              server_log=open(os.path.join(t,'server.log'),'w')
              server_env={'PATH':os.environ['PATH'],'LD_LIBRARY_PATH':str(candidates[0].parent)}
              server=subprocess.Popen([server_path,'-m',model,'--alias','claude-sonnet-4-5','--host','127.0.0.1','--port','18333','--ctx-size','8192','--threads','2','--n-predict','64','--jinja','-ngl','0'],cwd=t,env=server_env,stdout=server_log,stderr=subprocess.STDOUT)
              try:
                  deadline=time.monotonic()+120
                  while True:
                      if server.poll() is not None: raise RuntimeError('local model server exited before readiness')
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:18333/health',timeout=2) as response:
                              if response.status==200: break
                      except Exception: pass
                      if time.monotonic()>deadline: raise TimeoutError('local model server not ready')
                      time.sleep(1)
                  env={'PATH':os.environ['PATH'],'HOME':t,'CLAUDE_CONFIG_DIR':t,'ANTHROPIC_API_KEY':'synthetic-test-key','ANTHROPIC_BASE_URL':'http://127.0.0.1:18333','CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC':'1','DISABLE_TELEMETRY':'1'}
                  exe=os.path.join(os.environ['RUNNER_TEMP'],'claude-proof','node_modules','.bin','claude')
                  base=[exe,'--bare','--print','--model','claude-sonnet-4-5','--tools','','--max-turns','1','--system-prompt','Reply concisely.','--output-format','json']
                  first=subprocess.run(base+['Remember the word LANTERN. Reply OK.'],cwd=t,env=env,text=True,capture_output=True,timeout=120)
                  def decode(label, process):
                      try:
                          value=json.loads(process.stdout)
                      except Exception:
                          print(json.dumps({'stage':label,'exit':process.returncode,'stdout_tail':process.stdout[-800:],'stderr_tail':process.stderr[-800:]}))
                          raise
                      print(json.dumps({'stage':label,'exit':process.returncode,'is_error':value.get('is_error'),'subtype':value.get('subtype'),'result':str(value.get('result',''))[:800],'stderr_tail':process.stderr[-500:]}))
                      return value
                  first_result=decode('first',first)
                  session_id=first_result.get('session_id')
                  if first.returncode!=0 or first_result.get('is_error') or not session_id: raise RuntimeError('first CLI call failed')
                  second=subprocess.run(base+['--resume',session_id,'What word did I ask you to remember? Reply only the word.'],cwd=t,env=env,text=True,capture_output=True,timeout=120)
                  second_result=decode('second',second)
                  result=str(second_result.get('result',''))
                  summary={'first_exit':first.returncode,'second_exit':second.returncode,'same_session':session_id==second_result.get('session_id'),'model_recalled_marker':'LANTERN' in result.upper(),'server_still_running':server.poll() is None}
                  print(json.dumps(summary))
                  if second.returncode!=0 or second_result.get('is_error') or not summary['same_session'] or not summary['model_recalled_marker']: raise SystemExit(1)
              finally:
                  server.terminate()
                  try: server.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      server.kill(); server.wait()
                  server_log.close()
          PY
          python3 "$RUNNER_TEMP/probe.py"

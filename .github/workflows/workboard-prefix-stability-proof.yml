name: Workboard provider prefix stability proof

on:
  push:
    branches:
      - proof/workboard-prefix-stability-2026-11-02

permissions:
  contents: read

jobs:
  prefix-stability:
    name: Provider request prefix stability
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhanCold/openclaw
          ref: 9d34fe775fd2a3e6a607972d775be2099b285751
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node without package-manager cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: false
          package-manager-cache: false

      - name: Verify exact candidate and install frozen dependencies
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9d34fe775fd2a3e6a607972d775be2099b285751"
          test "$(git rev-parse HEAD:src/agents/agent-tools.prefix-stability.test.ts)" = "7687f61766ba4e2cf72d349c6119b9d7d1fa74bb"
          test "$(node --version)" = "v24.22.1"
          corepack enable
          test "$(corepack pnpm --version)" = "12.15.0"
          corepack pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run the required provider prefix stability regression
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm test src/agents/agent-tools.prefix-stability.test.ts --maxWorkers=1

      - name: Record scope and isolation
        if: always()
        shell: bash
        run: |
          {
            echo '# Provider prefix stability proof'
            echo
            echo "- Proof workflow commit: $GITHUB_SHA"
            echo '- Candidate: 9d34fe775fd2a3e6a607972d775be2099b285751'
            echo '- Test: src/agents/agent-tools.prefix-stability.test.ts'
            echo '- Runner: GitHub-hosted ubuntu-24.04.'
            echo '- Permissions: contents: read; checkout credentials are not persisted; setup-node package-manager cache is disabled.'
            echo '- No secrets, OIDC, environments, self-hosted runners, additional cache actions, or artifact uploads.'
            echo '- The test runs through the repository pnpm test wrapper in secretless fork CI; no candidate code runs on the credentialed Mac.'
            echo '- Logs and summary are retained in the Actions run.'
          } >> "$GITHUB_STEP_SUMMARY"
